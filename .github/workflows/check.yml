name: Verify assessment app
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build React frontend
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend api
      - name: Test demo product data
        run: python tests/test_catalog.py
      - name: Import FastAPI server and verify routes
        run: python -c "from backend.engine import app; assert any(r.path == '/api/recommend' for r in app.routes); print('Recommendation API route found')"
